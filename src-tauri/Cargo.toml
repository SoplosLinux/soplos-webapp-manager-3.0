[package]
name = "soplos-webapp-manager"
version = "3.0.0-beta"
description = "Soplos WebApp Manager"
authors = ["Sergi Perich <info@soploslinux.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "soplos_webapp_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "devtools" feature here: Tauri already enables the inspector
# automatically on debug builds (cfg(debug_assertions)); declaring the
# feature would force it on in release builds too.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Favicon download (DuckDuckGo / Google s2 fallback chain, same as 2.x).
ureq = "3"
uuid = { version = "1", features = ["v4"] }
# Encodes icon files as data: URIs for preview (see utils::icon_data_url).
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
